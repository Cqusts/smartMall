# Maven Wrapper —— 把 Maven 版本也锁进仓库。
#
# 起因：有人用 Maven 3.3.9（2015 年）构建，连着撞了三个错——
#   · 超级 POM 给了 compiler 3.1，回退到 source/target 1.5，报「不再支持源选项 5」
#   · 锁了插件版本后，又报 compiler 3.13.0 requires Maven 3.6.3
#   · 而 surefire 若拿到 2.12.4，会一个测试都不跑还报 BUILD SUCCESS
#
# 锁插件版本只解决了一半：插件版本不再飘，Maven 本身还在飘。用 wrapper
# 之后，`./mvnw` 会自动下载并使用这里指定的版本，**不管机器上装的是哪版、
# 甚至没装**，所有人拿到的构建环境完全一致。
#
# 用法：把命令里的 mvn 换成 ./mvnw（Windows 用 .\mvnw.cmd）。
#
# distributionUrl 指向阿里云镜像 —— 官方 repo.maven.apache.org 在国内常常
# 慢到超时，而这个项目的 alimaven 已经在用了。换回官方源直接改这一行：
#   https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://maven.aliyun.com/repository/public/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
