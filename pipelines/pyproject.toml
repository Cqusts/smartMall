[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartmall-pipeline"
version = "0.1.0"
description = "smartMall 数据中台流水线：四道清洗关卡、数据资产发布、知识覆盖度分析"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
db = ["SQLAlchemy>=2.0", "PyMySQL>=1.1"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["smartmall_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
