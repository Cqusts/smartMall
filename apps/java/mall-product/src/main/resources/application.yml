# mall-product —— 订单 / 商品 / 库存。**只依赖 MySQL 一个外部组件。**
#
# 曾经这里还配着 spring.data.redis 与 spring.kafka，两个 starter 也在 pom 里。
# 但代码里对它们是零引用 —— 没有 RedisTemplate、没有 @KafkaListener。结果是：
# 本机没起 Redis/Kafka 时，服务照样能起来，只是日志被连接重试刷屏，
# /actuator/health 长期 DOWN，而人会以为是自己环境没装齐。
# 配置只描述真实依赖，缺什么一眼看得出。将来哪个模块真要用，再连同代码一起加回来。

server:
  port: 8081

spring:
  application:
    name: mall-product

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:smartmall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:smartmall}
    password: ${MYSQL_PASSWORD:smartmall}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      # -1 = 启动时不校验连接。MySQL 还没起来时服务照样能启动并暴露 /health，
      # 由 /actuator/health 报告 db DOWN —— 好过启动直接失败、只留一行栈。
      initialization-fail-timeout: -1
      # **把连接的会话时区钉死，让 SQL 里的 NOW() 与 Java 的 LocalDateTime.now()
      # 说同一个时间。**
      #
      # AppTimeZone 只管得了 JVM 这一侧；NOW() 是在服务器上求值的，用的是
      # MySQL 的会话时区。两边不一致时，同一行订单里会出现「15:25 下单、
      # 23:25 发货」—— 而客服 Agent 正是照着这些字段回答"我的货什么时候发的"，
      # 于是它会讲出一段根本没发生过的 8 小时延迟。存进库里的脏数据，不是显示问题。
      #
      # 实测：MySQL 跑在 UTC 时，created_at 与 shipped_at 差整 480 分钟。
      #
      # 用数字偏移而不是 'Asia/Shanghai'：后者要求 MySQL 装过时区表
      # （mysql_tzinfo_to_sql），Windows 上默认没装，会直接报
      # "Unknown or incorrect time zone"，连都连不上。
      connection-init-sql: SET time_zone = '${DB_SESSION_TIME_ZONE:+08:00}'

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

smartmall:
  version: 0.1.0-SNAPSHOT

  order:
    # 订单号里的 2 位节点号（0-99）。单实例不用配。
    # 多实例部署时给每个实例配成不同的值：不配的话由「主机名+进程号+启动时刻」
    # 散列出来，两个实例散列到同一个值的概率是 1%，那时它们在同一秒仍可能撞号。
    # 撞了也不会丢单（place() 对 uk_order_no 冲突整笔重试），但显式配置能让
    # 这条兜底从"偶尔触发"变成"几乎不触发"。
    # node-id: 0
    # 下单即扣库存（预占），所以未支付的单必须有人回收，否则一批放弃支付的
    # 订单会把热销 SKU 的库存永久锁死。30 分钟是拍的不是算的——真实场景由
    # 支付渠道超时与大促周转速度决定，通常 15–30 分钟，上生产前按实测重定
    payment-ttl: PT30M
    # 下单舱壁：限制**同一个 SKU** 同时进入「扣库存事务」的并发数，超出快速失败（RATE_LIMITED），
    # 不让一个爆款的请求在行锁上排队、占满连接池而拖累别的商品。原因与实测见 PlacementGate 类注释。
    gate:
      max-concurrent-per-sku: 4   # 同一行库存上再多的并发也不会更快，多出来的只是占连接
      # 全局上限默认放开（64 > 连接池 10）。第一版设成 8，在分散下单的正常高并发下误拒了 22%——
      # 它比连接池还小，自己成了吞吐限制器。只有"好几个爆款同时来"才需要按池大小调小它
      max-concurrent-total: 64
      max-wait: PT0.2S            # 等许可最多这么久，用来抹平突发；等不到就拒绝
    release-expired:
      enabled: true
      interval: PT1M          # 上一轮跑完后再等多久（fixedDelay）
      initial-delay: PT30S    # 启动后先缓一会，别和应用初始化抢资源
      batch-size: 200         # 每批条数
      max-run: PT30S          # 一次触发里最多翻多久。积压时循环翻批直到队列空或用完这个预算，
                              # 没翻完的留给下一轮。原先每轮只处理一批（200 单/分钟）

logging:
  level:
    root: INFO
    com.smartmall: DEBUG
