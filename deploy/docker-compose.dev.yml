# smartMall 最小开发依赖
#
# 只起 MySQL + Redis + Milvus，约 12G 内存即可，适合笔记本开发。
# 应用服务在 IDE 里直接跑（默认配置指向 localhost），不进容器。
#
# 启动：docker compose -f deploy/docker-compose.dev.yml up -d
#
# 与 base.yml 的差异：省掉 Kafka / ClickHouse / SeaweedFS / Langfuse-PG。
# 需要它们时直接用 base.yml。

name: smartmall-dev

networks:
  smartmall-dev:
    name: smartmall-dev

volumes:
  dev-mysql:
  dev-milvus:
  dev-milvus-etcd:
  dev-milvus-objstore:

services:

  mysql:
    image: mysql:8.0
    container_name: smdev-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartmall
      MYSQL_USER: smartmall
      MYSQL_PASSWORD: smartmall
      TZ: Asia/Shanghai
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    ports: ["3306:3306"]
    volumes:
      - dev-mysql:/var/lib/mysql
      - ./sql/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [smartmall-dev]

  redis:
    image: redis:7-alpine
    container_name: smdev-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    networks: [smartmall-dev]

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: smdev-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
    command: >
      etcd -advertise-client-urls=http://milvus-etcd:2379
           -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes: [dev-milvus-etcd:/etcd]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [smartmall-dev]

  milvus-objstore:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: smdev-milvus-objstore
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data
    volumes: [dev-milvus-objstore:/minio_data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [smartmall-dev]

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: smdev-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-objstore:9000
    ports: ["19530:19530", "9091:9091"]
    volumes: [dev-milvus:/var/lib/milvus]
    depends_on:
      milvus-etcd: { condition: service_healthy }
      milvus-objstore: { condition: service_healthy }
    networks: [smartmall-dev]
