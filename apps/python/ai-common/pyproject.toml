[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-common"
version = "0.1.0"
description = "smartMall Python AI 服务公共库：应用工厂、统一响应、健康检查、Kafka 契约"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
]

[project.optional-dependencies]
kafka = ["aiokafka>=0.11"]
redis = ["redis>=5.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_common"]
