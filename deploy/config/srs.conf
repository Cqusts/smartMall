# SRS 配置 —— 直播推流接入与录制
#
# 录制策略：整场完整录制，不做实时切分。
# 语义分段需要看上下文才能判断商品讲解边界，流式处理会切错；
# 且主播常"讲到一半被弹幕打断，回头再补充"，只有全片才能正确归并。
# 详见 docs/08-agent-live-clip.md。

listen              1935;
max_connections     100;
daemon              off;
srs_log_tank        console;
srs_log_level       info;

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

stats {
    network         0;
}

vhost __defaultVhost__ {

    # ---- 录制 ----
    dvr {
        enabled         on;
        dvr_plan        session;          # 一场直播录一个文件
        dvr_path        ./objs/nginx/html/record/[app]/[stream]/[timestamp].mp4;
        dvr_duration    0;                # 不切分
        dvr_wait_keyframe on;             # 从关键帧开始，避免开头花屏
    }

    # ---- 回调 ----
    # on_dvr 是切片链路的入口：录制完成后网关转发到 ai-clip，
    # 由其投递 live.record.done 事件。
    http_hooks {
        enabled         on;
        on_publish      http://mall-gateway:8080/api/live/on-publish;
        on_unpublish    http://mall-gateway:8080/api/live/on-unpublish;
        on_dvr          http://mall-gateway:8080/api/live/on-dvr;
    }

    # ---- 播放 ----
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    hls {
        enabled         on;
        hls_fragment    6;
        hls_window      60;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    play {
        gop_cache       on;
    }
}
