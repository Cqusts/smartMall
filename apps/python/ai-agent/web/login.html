<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · smartMall</title>
<link rel="stylesheet" href="/base.css">
<style>
/* 只放这一页要用的。调色板、按钮、输入框、版式都在 /base.css 里 */
body{margin:0;font:14px/1.6 var(--sans);color:var(--ink);
     -webkit-font-smoothing:antialiased}
.back{position:absolute;top:26px;left:28px;font-size:13.5px;color:var(--ink-3)}
.back:hover{color:var(--ink)}
form{display:none}
form.on{display:block}
</style>
</head>
<body class="authpage">

<a class="back" href="/">← 回店铺</a>

<div class="authcard">
  <div class="logo">smart<span>Mall</span>.</div>
  <div class="sub">买家中心</div>

  <div class="authtabs">
    <button id="tabLogin" class="on" onclick="showTab('login')">登录</button>
    <button id="tabReg" onclick="showTab('reg')">注册</button>
  </div>

  <div class="msg" id="msg"></div>

  <!-- 登录 -->
  <form id="formLogin" class="on" onsubmit="doLogin(event)">
    <div class="field" id="fLoginName">
      <label for="loginName">用户名</label>
      <input class="inp" id="loginName" autocomplete="username" autofocus>
    </div>
    <div class="field" id="fLoginPass">
      <label for="loginPass">密码</label>
      <input class="inp" id="loginPass" type="password" autocomplete="current-password">
    </div>
    <button class="btn primary block lg" id="btnLogin" type="submit">登录</button>
  </form>

  <!-- 注册。**没有"账号类型"这一栏，而且不会有** —— 后端的
       RegisterRequest 上就没有 role 字段，注册出来一律是买家。
       商家账号走种子数据或 DBA，见 /merchant/login 页上的说明。 -->
  <form id="formReg" onsubmit="doRegister(event)">
    <div class="field" id="fRegName">
      <label for="regName">用户名</label>
      <input class="inp" id="regName" autocomplete="username">
      <div class="tip">3–32 位，字母、数字、下划线或连字符</div>
    </div>
    <div class="field" id="fRegPass">
      <label for="regPass">密码</label>
      <input class="inp" id="regPass" type="password" autocomplete="new-password">
      <div class="tip">至少 8 位</div>
    </div>
    <div class="field" id="fRegPass2">
      <label for="regPass2">确认密码</label>
      <input class="inp" id="regPass2" type="password" autocomplete="new-password">
    </div>
    <div class="field" id="fRegNick">
      <label for="regNick">昵称 <span style="color:var(--ink-3)">（可不填）</span></label>
      <input class="inp" id="regNick" maxlength="32" autocomplete="nickname">
    </div>
    <button class="btn primary block lg" id="btnReg" type="submit">注册并登录</button>
  </form>

  <div class="authhint">
    <b>演示账号</b>　<code>demo</code> / <code>buyer2</code>，密码
    <code>smartmall123</code>（见 <code>010_auth.sql</code> 的种子）。
    这是公开的演示口令，别在真实环境里用这份种子数据。
  </div>

  <div class="authfoot">
    店里的人？<a href="/merchant/login">商家登录</a>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);

/* 登录成功后回哪儿去。
   ?redirect= 只接受**站内绝对路径**：不校验的话，把一个外站地址塞进
   redirect 就是一个开放重定向——钓鱼邮件里挂的是本站域名，用户看到
   熟悉的登录页，登完被送去别人的站。
   开头两个斜杠的也要挡：那是协议相对地址，浏览器按外站解析，而只判断
   "以 / 开头"恰好会放它过去。 */
function nextUrl(){
  const raw = new URLSearchParams(location.search).get('redirect') || '/';
  return (raw.startsWith('/') && !raw.startsWith('//')) ? raw : '/';
}

function showTab(name){
  $('#formLogin').classList.toggle('on', name === 'login');
  $('#formReg').classList.toggle('on', name === 'reg');
  $('#tabLogin').classList.toggle('on', name === 'login');
  $('#tabReg').classList.toggle('on', name === 'reg');
  $('#msg').className = 'msg';
  clearBad();
  (name === 'login' ? $('#loginName') : $('#regName')).focus();
}

function say(kind, text){
  const m = $('#msg');
  m.className = 'msg on ' + kind;
  m.textContent = text;
}

/* 出错时把光标放回出问题的那一栏。只在顶上给一句"信息有误"的话，
   用户得自己逐栏猜是哪一个——注册表单有四栏，猜错三次就走了 */
function bad(fieldId, text){
  const f = $(fieldId);
  f.classList.add('bad');
  const tip = f.querySelector('.tip');
  if (tip && text) tip.textContent = text;
  f.querySelector('.inp').focus();
}
function clearBad(){
  document.querySelectorAll('.field.bad').forEach(f => f.classList.remove('bad'));
  $('#fRegName').querySelector('.tip').textContent =
    '3–32 位，字母、数字、下划线或连字符';
  $('#fRegPass').querySelector('.tip').textContent = '至少 8 位';
}

/* 登录态存 localStorage，键与店铺页、商家后台共用同一个。
   **它只是凭证，不是身份本身**：后端只认令牌里的签名，
   在这里把 role 改成 merchant 也一样会被 @RequireMerchant 拦下。 */
function saveAuth(a){
  try{ localStorage.setItem('smartmall.auth', JSON.stringify(a)); }catch(e){}
}

async function post(url, body){
  const r = await fetch(url, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  return await r.json();
}

/* 后端不可用时要说清是哪一层。"登录失败"四个字会让人去查密码，
   而最常见的原因是 mall-product 根本没起来（转发层回 9503） */
function explain(d){
  return (d.message || '未知错误')
    + (d.code === 9503 ? '（订单服务 mall-product:8081 没起来，'
                       + '在仓库根跑 make run-product）' : '');
}

async function doLogin(ev){
  ev.preventDefault();
  clearBad();
  const username = $('#loginName').value.trim();
  const password = $('#loginPass').value;
  if (!username) return bad('#fLoginName', '');
  if (!password) return bad('#fLoginPass', '');

  const btn = $('#btnLogin');
  btn.disabled = true; btn.textContent = '登录中…';
  try{
    const d = await post('/api/auth/login', {username, password});
    if (d.code !== 0){ say('err', explain(d)); return; }
    saveAuth(d.data);
    location.href = nextUrl();
  }catch(e){
    say('err', '登录失败：' + (e.message || e));
  }finally{
    btn.disabled = false; btn.textContent = '登录';
  }
}

async function doRegister(ev){
  ev.preventDefault();
  clearBad();
  const username = $('#regName').value.trim();
  const password = $('#regPass').value;
  const password2 = $('#regPass2').value;
  const nickname = $('#regNick').value.trim();

  /* 前端这几条只是**少跑一趟网络**，不是校验本身——真正的校验在
     RegisterRequest 的注解上。所以这里的规则要和那边一致（3–32 位、
     字母数字下划线连字符、密码 8 位起），不一致的方向通常是前端更松，
     表现为"提交了才报错"。 */
  if (!/^[A-Za-z0-9_-]{3,32}$/.test(username))
    return bad('#fRegName', '3–32 位，只能用字母、数字、下划线或连字符');
  if (password.length < 8) return bad('#fRegPass', '至少 8 位');
  if (password !== password2) return bad('#fRegPass2', '');

  const btn = $('#btnReg');
  btn.disabled = true; btn.textContent = '注册中…';
  try{
    const d = await post('/api/auth/register', {username, password, nickname});
    if (d.code === 1409){ bad('#fRegName', d.message || '用户名已被占用'); return; }
    if (d.code !== 0){ say('err', explain(d)); return; }
    saveAuth(d.data);
    location.href = nextUrl();
  }catch(e){
    say('err', '注册失败：' + (e.message || e));
  }finally{
    btn.disabled = false; btn.textContent = '注册并登录';
  }
}

// ?tab=reg 直接打开注册页 —— 店铺页的"还没有账号"那个链接指到这里
if (new URLSearchParams(location.search).get('tab') === 'reg') showTab('reg');
</script>
</body>
</html>
